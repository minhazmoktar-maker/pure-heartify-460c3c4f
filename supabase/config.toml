# Streams allowlisted recitation CDNs with CORS headers so offline downloads
# work for anonymous listeners too.
[functions.audio-proxy]
verify_jwt = false

# Public content endpoints — anonymous visitors browse /, /watch/:id, /search
# and /section/* without a session, so JWT verification must be disabled at
# the edge. Each function still runs its own rate limiting and authz.
[functions.youtube-proxy]
verify_jwt = false

