name: i18n locale gate

# Fails the build when any shipped locale is missing a required UI string or a
# player UI label, or when a dictionary drifts out of parity with en.json.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  locale-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Required UI + player strings present for every locale
        run: bun run i18n:check
