name: design-lint
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/design-lint.mjs"
      - "docs/DESIGN_SYSTEM.md"
  push:
    branches: [main]

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Phase 4 flipped this to enforce mode. All violations fail the build.
      # Legitimate exceptions use `// design-lint-disable` (line) or
      # `// design-lint-disable-file` (file header).
      - name: design-lint (enforce)
        run: node scripts/design-lint.mjs
