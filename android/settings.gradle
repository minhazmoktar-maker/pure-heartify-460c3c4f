include ':app'

// The Cordova-compat module is generated by `npx cap sync android` and is not
// committed to git. Only include it when it is actually present so the Android
// project still loads on a fresh checkout.
def cordovaPluginsDir = new File(rootDir, 'capacitor-cordova-android-plugins')
if (new File(cordovaPluginsDir, 'build.gradle').exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = cordovaPluginsDir
}

// Generated by `npx cap sync android`; absent before the first sync.
def capacitorSettings = new File(rootDir, 'capacitor.settings.gradle')
if (capacitorSettings.exists()) {
    apply from: capacitorSettings
}
